groups:
  - name: pme
    rules:
      - alert: ServeurInjoignable
        expr: up == 0
        for: 1m
        labels:
          severity: critique
        annotations:
          summary: "{{ $labels.instance }} ne répond plus à Prometheus"

      - alert: VarBientotPlein
        expr: node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 0.15
        for: 10m
        labels:
          severity: avertissement
        annotations:
          summary: "/var est rempli à plus de 85 % sur {{ $labels.instance }}"

      - alert: ServiceArrete
        expr: node_systemd_unit_state{state="active"} == 0
        for: 1m
        labels:
          severity: critique
        annotations:
          summary: "{{ $labels.name }} n'est plus actif sur {{ $labels.instance }}"
