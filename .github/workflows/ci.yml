name: ci
on: [push]
jobs:
  controle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint
      - name: Mot de passe du coffre (seulement si vous utilisez Vault)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          if [ -n "$VAULT_PASS" ]; then
            echo "$VAULT_PASS" > "$RUNNER_TEMP/vault_pass"
            echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"
          fi
      - run: ansible-lint --profile basic
      - run: ansible-playbook -i inventaire/hosts.ini site.yml --syntax-check
